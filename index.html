<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title" id="siteName"></h1>
      <p class="site-subtitle">Inventor &amp; Innovator</p>
    </div>
  </header>

  <main class="container">

    <!-- Widget grid — add more widgets here later -->
    <section class="widget-grid">

      <a href="patents.html" class="widget patent-widget" id="patentWidget" aria-label="View my patents">
        <div class="widget-icon">
          <!-- Rocket sketches itself stroke-by-stroke on load, then engine pulses -->
          <svg class="widget-rocket" viewBox="0 0 56 82" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Body -->
            <path class="rk rk-body"   d="M28 5 C28 5 44 19 44 43 L44 57 L28 65 L12 57 L12 43 C12 19 28 5 28 5 Z"/>
            <!-- Left fin -->
            <path class="rk rk-fin-l"  d="M12 47 L3 63 L12 57"/>
            <!-- Right fin -->
            <path class="rk rk-fin-r"  d="M44 47 L53 63 L44 57"/>
            <!-- Porthole ring -->
            <circle class="rk rk-port" cx="28" cy="34" r="9"/>
            <!-- Crosshair H -->
            <line  class="rk rk-ch"    x1="19" y1="34" x2="37" y2="34"/>
            <!-- Crosshair V -->
            <line  class="rk rk-cv"    x1="28" y1="25" x2="28" y2="43"/>
            <!-- Nozzle -->
            <path class="rk rk-nozzle" d="M19 65 L21 73 L35 73 L37 65"/>
            <!-- Engine glow (filled, pulsing) -->
            <ellipse class="rk-glow"   cx="28" cy="74" rx="6" ry="3.5"/>
          </svg>
        </div>
        <div class="widget-count" id="patentCount">—</div>
        <div class="widget-label">Patents</div>
        <div class="widget-sub" id="patentLastUpdated"></div>
        <div class="widget-cta">View all &rarr;</div>
      </a>

      <!-- Future widgets go here -->

    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footerYear"></span> <span id="footerName"></span></p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
