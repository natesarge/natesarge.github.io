<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1 class="site-title" id="siteName"></h1>
      <p class="site-subtitle">Inventor &amp; Innovator</p>
    </div>
  </header>

  <main class="container">

    <!-- Widget grid — add more widgets here later -->
    <section class="widget-grid">

      <a href="patents.html" class="widget patent-widget" id="patentWidget" aria-label="View my patents">
        <div class="widget-icon">&#9881;</div>
        <div class="widget-count" id="patentCount">—</div>
        <div class="widget-label">Patents</div>
        <div class="widget-sub" id="patentLastUpdated"></div>
        <div class="widget-cta">View all &rarr;</div>
      </a>

      <!-- Future widgets go here -->

    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footerYear"></span> <span id="footerName"></span></p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
