name: Update Patent Data

# Run on the 1st of every month at 06:00 UTC
# Also allows manual trigger from the GitHub Actions UI
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────
# SETUP: Add these three secrets in your repo under
# Settings → Secrets and variables → Actions:
#
#   INVENTOR_FIRST   Your first name as it appears on patents
#                    Example: tony
#
#   INVENTOR_LAST    Your last name as it appears on patents
#                    Example: stark
#
#   INVENTOR_CITIES  Comma-separated list of cities on your patents
#                    Example: malibu,kunar,new york city
#
# DATA SOURCE: USPTO Patent Public Search (ppubs.uspto.gov)
# No API key required — uses the same backend as the USPTO website.
# ──────────────────────────────────────────────────────────────

jobs:
  fetch-patents:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated patents.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch patents from USPTO Patent Public Search
        env:
          INVENTOR_FIRST:  ${{ secrets.INVENTOR_FIRST }}
          INVENTOR_LAST:   ${{ secrets.INVENTOR_LAST }}
          INVENTOR_CITIES: ${{ secrets.INVENTOR_CITIES }}
        run: |
          python3 - <<'PYEOF'
          import json, sys, datetime, os, urllib.request, urllib.error, http.cookiejar

          # ── Read secrets from environment ────────────────────────────
          first  = os.environ.get('INVENTOR_FIRST', '').strip().lower()
          last   = os.environ.get('INVENTOR_LAST', '').strip().lower()
          cities = [c.strip().lower() for c in os.environ.get('INVENTOR_CITIES', '').split(',') if c.strip()]

          if not first or not last or not cities:
              print("ERROR: INVENTOR_FIRST, INVENTOR_LAST, and INVENTOR_CITIES secrets must all be set.", file=sys.stderr)
              sys.exit(1)

          # ── Build PPUBS query string ──────────────────────────────────
          # Field codes: .INL. = inventor last name
          #              .INF. = inventor first name
          #              .IC.  = inventor city
          # Multi-word city names must be quoted.
          city_parts = [f'"{c}"' if ' ' in c else c for c in cities]
          city_query = ' OR '.join(city_parts)
          query_str  = f'({last}).INL. AND ({first}).INF. AND (({city_query}).IC.)'

          print(f"Query: {query_str}")

          BASE = "https://ppubs.uspto.gov"

          # Use a cookie jar so the session cookie is retained across requests
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie_jar))

          def request(method, url, body=None, extra_headers=None):
              headers = {
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (compatible; patent-widget/1.0)",
              }
              if extra_headers:
                  headers.update(extra_headers)
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with opener.open(req, timeout=30) as resp:
                      body_bytes = resp.read().decode()
                      resp_headers = dict(resp.headers)
                      return body_bytes, resp_headers
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code} error at {url}:\n{e.read().decode()}", file=sys.stderr)
                  sys.exit(1)
              except urllib.error.URLError as e:
                  print(f"Network error at {url}: {e.reason}", file=sys.stderr)
                  sys.exit(1)

          # ── Step 1: Load the app page (sets initial cookies) ─────────
          print("Loading PPUBS app page...")
          request("GET", f"{BASE}/pubwebapp/")

          # ── Step 2: Obtain a session caseId + access token ───────────
          # The session endpoint returns caseId in JSON and X-Access-Token in headers.
          print("Requesting session...")
          session_body, session_headers = request(
              "POST",
              f"{BASE}/api/users/me/session",
              body=b'"-1"',
              extra_headers={"X-Access-Token": "null"}
          )
          print(f"Session response: {session_body[:200]}")
          session = json.loads(session_body)
          case_id = session['userCase']['caseId']
          access_token = session_headers.get('X-Access-Token') or session_headers.get('x-access-token', '')
          print(f"Session caseId: {case_id}  access_token: {'<present>' if access_token else '<absent>'}")

          # ── Step 3: Search granted US patents ─────────────────────────
          search_payload = {
              "start": 0,
              "pageCount": 500,
              "sort": "date_publ desc",
              "docFamilyFiltering": "familyIdFiltering",
              "familyIdEnglishOnly": True,
              "familyIdFirstPreferred": "US-PGPUB",
              "familyIdSecondPreferred": "USPAT",
              "familyIdThirdPreferred": "FPRS",
              "showDocPerFamilyPref": "showEnglish",
              "query": {
                  "caseId": case_id,
                  "hl_snippets": "2",
                  "op": "OR",
                  "q": query_str,
                  "queryName": query_str,
                  "highlights": "1",
                  "qt": "brs",
                  "spellCheck": False,
                  "viewName": "tile",
                  "plurals": True,
                  "britishEquivalents": True,
                  "databaseFilters": [
                      {"databaseName": "USPAT", "countryCodes": []}
                  ],
                  "searchType": 1,
                  "ignorePersist": True,
                  "userEnteredQuery": query_str
              }
          }

          search_extra = {"X-Access-Token": access_token} if access_token else {}
          raw, _ = request(
              "POST",
              f"{BASE}/api/searches/searchWithBeFamily",
              body=json.dumps(search_payload).encode(),
              extra_headers=search_extra
          )
          print(f"Search response preview: {raw[:300]}")

          result = json.loads(raw)

          total = result.get('totalResults') or result.get('numFound', 0)
          print(f"Total patents found: {total}")
          if total > 500:
              print(f"WARNING: {total} results found but only 500 retrieved.")

          patents_raw = result.get('patents') or []

          patents = [
              {
                  "number": p.get("publicationReferenceDocumentNumber", ""),
                  "title":  p.get("inventionTitle", ""),
                  "date":   p.get("datePublished", "")
              }
              for p in patents_raw
          ]

          display_name = f"{first.capitalize()} {last.capitalize()}"

          output = {
              "last_updated": datetime.date.today().isoformat(),
              "display_name": display_name,
              "patents": patents
          }

          with open("data/patents.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Wrote {len(patents)} patents to data/patents.json")
          PYEOF

      - name: Commit updated patents.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/patents.json

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to patent data — skipping commit."
          else
            COUNT=$(python3 -c "import json; d=json.load(open('data/patents.json')); print(len(d['patents']))")
            git commit -m "chore: update patent data (${COUNT} patents) [$(date -u '+%Y-%m-%d')]"
            git push origin HEAD
          fi
