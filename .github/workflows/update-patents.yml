name: Update Patent Data

# Run on the 1st of every month at 06:00 UTC
# Also allows manual trigger from the GitHub Actions UI
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────
# SETUP: Before this workflow will run, add these four secrets
# in your repo under Settings → Secrets and variables → Actions:
#
#   INVENTOR_FIRST   Your first name as it appears on patents
#                    Example: tony
#
#   INVENTOR_LAST    Your last name as it appears on patents
#                    Example: stark
#
#   INVENTOR_CITIES  Comma-separated list of cities on your patents
#                    Example: malibu,kunar,new york city
#
#   LENS_API_TOKEN   Free API token from Lens.org
#                    Register at: https://www.lens.org/lens/user/subscriptions
#
# NOTE: When PatentsView (patentsview.org) resumes issuing API keys,
# this workflow can be switched back to use their API instead.
# ──────────────────────────────────────────────────────────────

jobs:
  fetch-patents:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated patents.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch patents from Lens.org API
        env:
          INVENTOR_FIRST:  ${{ secrets.INVENTOR_FIRST }}
          INVENTOR_LAST:   ${{ secrets.INVENTOR_LAST }}
          INVENTOR_CITIES: ${{ secrets.INVENTOR_CITIES }}
          LENS_API_TOKEN:  ${{ secrets.LENS_API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, sys, datetime, os, urllib.request, urllib.error

          # ── Read secrets from environment ────────────────────────────
          first  = os.environ.get('INVENTOR_FIRST', '').strip().lower()
          last   = os.environ.get('INVENTOR_LAST', '').strip().lower()
          cities = [c.strip().lower() for c in os.environ.get('INVENTOR_CITIES', '').split(',') if c.strip()]
          token  = os.environ.get('LENS_API_TOKEN', '').strip()

          if not first or not last or not cities:
              print("ERROR: INVENTOR_FIRST, INVENTOR_LAST, and INVENTOR_CITIES secrets must all be set.", file=sys.stderr)
              sys.exit(1)
          if not token:
              print("ERROR: LENS_API_TOKEN secret must be set. Register at https://www.lens.org/lens/user/subscriptions", file=sys.stderr)
              sys.exit(1)

          print(f"Querying for inventor '{first} {last}' in cities: {cities}")

          # ── Build Lens.org API query ──────────────────────────────────
          # Uses Elasticsearch bool query syntax:
          #   must  = AND  (all conditions required)
          #   should + minimum_should_match = OR  (at least one city required)
          city_clauses = [{"match": {"inventor.address": city}} for city in cities]

          query = {
              "query": {
                  "bool": {
                      "must": [
                          {"match": {"inventor.name": last}},
                          {"match": {"inventor.name": first}},
                          {"term":  {"jurisdiction": "US"}},
                          {
                              "bool": {
                                  "should": city_clauses,
                                  "minimum_should_match": 1
                              }
                          }
                      ]
                  }
              },
              "include": ["doc_number", "title", "date_published", "legal_status"],
              "size": 500,
              "from": 0,
              "sort": [{"date_published": "desc"}]
          }

          payload = json.dumps(query).encode()

          # ── Call the API ──────────────────────────────────────────────
          req = urllib.request.Request(
              "https://api.lens.org/patent/search",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode()
          except urllib.error.HTTPError as e:
              print(f"HTTP error {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"Network error: {e.reason}", file=sys.stderr)
              sys.exit(1)

          print(f"API response preview: {raw[:300]}")

          # ── Parse and transform ───────────────────────────────────────
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"JSON parse error: {e}", file=sys.stderr)
              sys.exit(1)

          patents_raw = data.get('data') or []

          patents = [
              {
                  "number": p.get("doc_number", ""),
                  "title":  p.get("title", ""),
                  # Prefer grant date; fall back to publication date
                  "date":   (p.get("legal_status") or {}).get("grant_date") or p.get("date_published", "")
              }
              for p in patents_raw
          ]

          display_name = f"{first.capitalize()} {last.capitalize()}"

          output = {
              "last_updated": datetime.date.today().isoformat(),
              "display_name": display_name,
              "patents": patents
          }

          with open("data/patents.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Wrote {len(patents)} patents to data/patents.json")
          PYEOF

      - name: Commit updated patents.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/patents.json

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to patent data — skipping commit."
          else
            COUNT=$(python3 -c "import json; d=json.load(open('data/patents.json')); print(len(d['patents']))")
            git commit -m "chore: update patent data (${COUNT} patents) [$(date -u '+%Y-%m-%d')]"
            git push origin HEAD
          fi
